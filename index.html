<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SafeStore</title>
<style>
:root{--blue:#0F2C61;--blue2:#1E4BD8;--light:#F1F5F9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:apple-system,sans-serif;background:var(--light);color:#1E293B}
.top{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:28px 20px 44px;text-align:center}
.wrap{max-width:760px;margin:-22px auto 0;padding:0 12px 50px}
.card{background:#fff;border-radius:20px;padding:18px;border:1px solid #DBEAFE;margin-bottom:16px}
.tab{display:flex;gap:8px;margin:16px 0}
.tab button{flex:1;padding:12px;border-radius:12px;border:1.5px solid #BFDBFE;background:#EFF6FF;font-weight:700;cursor:pointer}
.tab button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.input{width:100%;padding:14px;border-radius:14px;border:2px solid #BFDBFE;font-size:15px}
.grid{display:grid;gap:8px}
.check{display:flex;gap:10px;padding:11px 12px;background:#F8FAFC;border:1.5px solid #E2E8F0;border-radius:12px;font-size:13px;cursor:pointer}
.check:has(input:checked){background:#EFF6FF}
.check.risk:has(input:checked){background:#FEF2F2;border-color:#FCA5A5}
.check.pos:has(input:checked){background:#F0FDF4;border-color:#86EFAC}
.btn{width:100%;margin-top:14px;padding:14px;border-radius:14px;background:var(--blue);color:#fff;font-weight:800;border:0;cursor:pointer}
.btn2{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.res{margin-top:16px;border-radius:18px;overflow:hidden;display:none;border:2px solid #E2E8F0}
.res-head{padding:16px}
.res-body{padding:14px;background:#fff}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kpi{padding:10px;border-radius:12px;border:1px solid #E2E8F0;background:#F8FAFC}
.kpi b{font-size:18px;display:block}
.domain-card{display:grid;gap:6px;margin-top:10px}
.domain-item{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border:1px solid #E2E8F0;border-radius:10px;font-size:12px;background:#F8FAFC}
.domain-item.risk{background:#FEF2F2;border-color:#FCA5A5}
.domain-item.ok{background:#F0FDF4;border-color:#BBF7D0}
.small{font-size:11px;color:#64748B}
.exp-card{padding:12px;border:1px solid #E2E8F0;border-radius:14px;background:#fff;margin-bottom:10px}
.del{margin-top:8px;padding:6px 10px;border-radius:8px;border:1px solid #FECACA;background:#FEF2F2;color:#B91C1C;font-size:11px;cursor:pointer}
.text{width:100%;padding:11px;border:1px solid #CBD5E1;border-radius:10px;margin-top:8px;font-size:13px}
.hist-item{display:flex;justify-content:space-between;gap:8px;padding:10px;border:1px solid #E2E8F0;border-radius:10px;margin-bottom:6px;background:#fff;font-size:12px}
.disclaimer{margin-top:12px;padding:10px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:12px;font-size:11px;color:#64748B}
.hidden{display:none}
.loader{width:12px;height:12px;border:2px solid #CBD5E1;border-top-color:var(--blue);border-radius:50%;display:inline-block;animation:spin.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.section-label{font-size:11px;font-weight:800;color:#334155;text-transform:uppercase;margin:18px 0 8px;display:flex;justify-content:space-between}
.state-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.state{font-size:11px;padding:5px 8px;border-radius:999px;border:1px solid #E2E8F0;background:#fff}
.action-list{display:grid;gap:6px;margin-top:8px}
.action-list li{list-style:none;padding:8px 10px;background:#F1F5F9;border-radius:10px;font-size:12px;border:1px solid #E2E8F0}
.why-btn{margin-left:auto;background:#fff;border:1px solid #E2E8F0;border-radius:999px;padding:2px 8px;font-size:11px;cursor:pointer}
</style>
</head>
<body>
<div class="top"><h1>SafeStore</h1><p style="margin-top:6px;font-size:14px;opacity:.9">Verifica antes de pagar - datos reales</p></div>
<div class="wrap"><div class="card">
<div class="tab"><button id="btnTabWeb" class="active">Analizar enlace</button><button id="btnTabExp">Comunidad</button></div>
<div id="seccionWeb">
<input id="url" class="input" placeholder="Pega link ej: www.aurelius.com.ar">
<div class="section-label"><span>Senales de riesgo</span></div>
<div class="grid">
<label class="check risk"><input type="checkbox" id="c1"><span><b>Solo acepta transferencia / cripto</b></span></label>
<label class="check risk"><input type="checkbox" id="c2"><span><b>No muestra CUIT ni domicilio</b></span></label>
<label class="check risk"><input type="checkbox" id="c3"><span><b>Precios muy bajos y apura a pagar</b></span></label>
<label class="check risk"><input type="checkbox" id="c4"><span><b>Sin politica de cambios</b></span></label>
<label class="check risk"><input type="checkbox" id="c5"><span><b>Fotos robadas o solo WhatsApp</b></span></label>
</div>
<div class="section-label"><span>Senales positivas</span></div>
<div class="grid">
<label class="check pos"><input type="checkbox" id="c6"><span><b>Muestra CUIT verificable</b></span></label>
<label class="check pos"><input type="checkbox" id="c7"><span><b>Medios de pago con proteccion</b></span></label>
<label class="check pos"><input type="checkbox" id="c8"><span><b>Redes activas y resenas reales</b></span></label>
</div>
<button class="btn" id="btnEvaluar">Analizar enlace</button>
<div id="res" class="res"><div class="res-head" id="resHead"><h2 id="tit"></h2><p id="score" class="small"></p><div class="state-row" id="stateRow"></div></div>
<div class="res-body">
<div class="kpis"><div class="kpi"><span class="small">Riesgo</span><b id="kpiRisk">0</b></div><div class="kpi"><span class="small">Positivas</span><b id="kpiPos">0</b></div></div>
<b style="font-size:13px;display:block;margin-top:14px">Analisis tecnico - datos reales</b><div class="domain-card" id="domainCard"></div>
<b style="font-size:13px;display:block;margin-top:14px">Que comprobamos</b><div id="ev" style="margin-top:8px;display:grid;gap:6px"></div>
<b style="font-size:13px;display:block;margin-top:14px">Experiencias</b><div id="resExpSum" class="small" style="margin-top:6px"></div>
<ul id="todoList" class="action-list"></ul>
<div class="disclaimer" id="disclaimerBox"></div>
</div></div>
<div style="margin-top:18px"><div class="section-label"><span>Historial local</span><button class="why-btn" id="btnClearHist">Borrar</button></div><div id="histList" class="small">Sin analisis previos</div></div>
</div>
<div id="seccionExp" class="hidden">
<h3>Experiencias</h3>
<select id="expTipo" class="text"><option value="ok">Compre y salio bien</option><option value="dudosa">Experiencia dudosa</option><option value="mala">Tuve problemas</option></select>
<input id="expNombre" class="text" placeholder="Tu nombre">
<input id="expTienda" class="text" placeholder="Tienda o @usuario">
<textarea id="expTexto" class="text" rows="3" placeholder="Que paso?"></textarea>
<input type="file" id="expFoto" accept="image/*" style="margin-top:8px;font-size:12px">
<button class="btn btn2" id="btnPub">Publicar</button>
<div id="resumenExp" class="card" style="margin-top:14px;padding:12px;background:#F8FAFC"></div>
<div id="listaExp" style="margin-top:14px">Cargando...</div>
</div>
</div></div>
<script>
document.getElementById('btnTabWeb').onclick=function(){this.className='active';document.getElementById('btnTabExp').className='';document.getElementById('seccionWeb').className='';document.getElementById('seccionExp').className='hidden';};
document.getElementById('btnTabExp').onclick=function(){this.className='active';document.getElementById('btnTabWeb').className='';document.getElementById('seccionExp').className='';document.getElementById('seccionWeb').className='hidden';};
function parseDomain(raw){if(!raw) return null;let v=raw.trim();if(v.startsWith('@')) return {domain:v.replace('@',''),https:'No aplica',raw:raw};try{if(!v.match(/^https?:\/\//)) v='https://'+v.replace(/^\/\//,'');const u=new URL(v);return {domain:u.hostname.toLowerCase(),https:u.protocol==='https:'?'Si':'No',raw:raw};}catch(e){return {domain:raw.toLowerCase(),https:'No pudimos',raw:raw};}}
function analyzeHeuristics(domain){const risky=['.xyz','.top','.shop','.store','.buzz','.sbs'];const res=[];const tld='.'+domain.split('.').pop();if(risky.includes(tld)) res.push({level:'risk',text:'TLD barato: '+tld});if((domain.match(/-/g)||[]).length>=3) res.push({level:'risk',text:'Muchos guiones'});if(domain.length>32) res.push({level:'risk',text:'Dominio muy largo'});if(res.length===0) res.push({level:'ok',text:'Sin patrones sospechosos'});return res;}

async function fetchViaProxy(domain){
  // Intento 1: Tu funcion propia (cuando la deployes)
  try{
    const r = await fetch(`https://ltaghuumilyjdzpmatqj.supabase.co/functions/v1/domain-check?domain=${encodeURIComponent(domain)}`, {signal: AbortSignal.timeout(4000)});
    if(r.ok){
      const j = await r.json();
      if(j && (j.crt || j.rdap)) return {...j, source: 'supabase' };
    }
  }catch(e){}

  // Intento 2: Proxy publico de respaldo (para que te ande HOY)
  try{
    const crtUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent('https://crt.sh/?q='+domain+'&output=json')}`;
    const rc = await fetch(crtUrl, {signal: AbortSignal.timeout(7000)});
    if(rc.ok){
      const data = await rc.json();
      if(Array.isArray(data) && data.length){
        const dates = data.map(d=>new Date(d.entry_timestamp)).sort((a,b)=>a-b);
        const first = dates[0];
        const days = Math.floor((Date.now()-first)/86400000);
        return {
          crt: { ok:true, first: first.toISOString(), total: data.length, days: days, years: (days/365).toFixed(1) },
          rdap: { ok:false, msg:"RDAP requiere funcion propia - edad por certificados disponible" },
          source: 'allorigins'
        };
      } else {
        return { crt:{ok:false, msg:"Sin certificados encontrados"}, rdap:{ok:false, msg:"Requiere funcion propia"}, source:'allorigins' };
      }
    }
  }catch(e){
    return { crt:{ok:false, msg:"No disponible: "+e.message}, rdap:{ok:false, msg:"Requiere funcion propia"}, source:'error' };
  }
  return { crt:{ok:false, msg:"No disponible"}, rdap:{ok:false, msg:"Requiere funcion propia"}, source:'none' };
}

async function renderDomainCardAsync(info){
 const card=document.getElementById('domainCard');
 if(!info||!info.domain){card.innerHTML='<div class="domain-item"><span>Dominio</span><b>No disponible</b></div>';return {};}
 card.innerHTML=`<div class="domain-item"><span>Dominio</span><b>${info.domain}</b></div><div class="domain-item"><span>Analizando</span><b><span class="loader"></span> consultando edad real...</b></div>`;
 const heur=analyzeHeuristics(info.domain);
 const data = await fetchViaProxy(info.domain);
 const crt = data.crt;
 const rdap = data.rdap;
 let html='';
 html+=`<div class="domain-item"><span>Dominio</span><b>${info.domain} [Comprobado]</b></div>`;
 html+=`<div class="domain-item ${info.https==='Si'?'ok':'risk'}"><span>HTTPS</span><b>${info.https}</b></div>`;
 if(crt && crt.ok){
   const d=new Date(crt.first);
   const src = data.source==='supabase'? 'via Supabase' : 'via proxy respaldo';
   html+=`<div class="domain-item ok"><span>Primer certificado</span><b>${d.toLocaleDateString('es-AR')} - hace ${crt.years||Math.floor(crt.days/365)} a&ntilde;os (${crt.days} dias) [${src}]</b></div>`;
   if(crt.total) html+=`<div class="domain-item"><span>Certificados</span><b>${crt.total} encontrados [crt.sh]</b></div>`;
 }else{
   html+=`<div class="domain-item"><span>Edad por certificados</span><b>${crt?crt.msg:'No disponible'}</b></div>`;
 }
 if(rdap && rdap.ok){
   const d=new Date(rdap.date);
   html+=`<div class="domain-item ok"><span>Creacion RDAP</span><b>${d.toLocaleDateString('es-AR')} - hace ${Math.floor(rdap.days/365)} a&ntilde;os [${data.source}]</b></div>`;
 }else{
   html+=`<div class="domain-item"><span>Creacion RDAP</span><b>${rdap?rdap.msg:'Requiere funcion propia'}</b></div>`;
 }
 heur.forEach(h=>{html+=`<div class="domain-item ${h.level==='risk'?'risk':'ok'}"><span>${h.level==='risk'?'Se&ntilde;al':'OK'}</span><b>${h.text}</b></div>`;});
 card.innerHTML=html;
 return {crt, rdap, source:data.source};
}

document.getElementById('btnEvaluar').onclick=async function(){
 let risk=0,pos=0;
 ['c1','c2','c3','c4','c5'].forEach(id=>{if(document.getElementById(id).checked) risk++;});
 ['c6','c7','c8'].forEach(id=>{if(document.getElementById(id).checked) pos++;});
 let raw=document.getElementById('url').value.trim();
 let info=parseDomain(raw);
 let res=document.getElementById('res');
 res.style.display='block';
 document.getElementById('tit').innerHTML='Analizando... <span class="loader"></span>';
 const extra=await renderDomainCardAsync(info);
 let ageRisk=false;
 if(extra.crt && extra.crt.ok && extra.crt.days<90) ageRisk=true;
 if(extra.rdap && extra.rdap.ok && extra.rdap.days<90) ageRisk=true;
 let nivel='Informacion insuficiente',color='#F8FAFC';
 if(risk>=3||ageRisk){nivel='Riesgo alto'+(ageRisk?' - dominio muy nuevo':'');color='#FEF2F2';}
 else if(risk>=1){nivel='Riesgo moderado';color='#FFFBEB';}
 else if(pos>=1){nivel='Bajo riesgo aparente';color='#F0FDF4';}
 document.getElementById('resHead').style.background=color;
 document.getElementById('tit').innerHTML=nivel;
 document.getElementById('kpiRisk').innerHTML=risk+(ageRisk?' + edad':'');
 document.getElementById('kpiPos').innerHTML=pos;
 document.getElementById('score').innerHTML=(info?info.domain:'')+' - '+new Date().toLocaleString('es-AR')+` <span class="small">[${extra.source||'local'}]</span>`;
 document.getElementById('stateRow').innerHTML=`<span class="state">Riesgo: ${risk}</span>`+(ageRisk?`<span class="state">Dominio nuevo: ${extra.crt?.days||extra.rdap?.days} dias</span>`:'');
 document.getElementById('ev').innerHTML=`<div class="domain-item ok"><span>Comprobado</span><span>${info?info.domain:''}</span></div>`+(extra.crt?.ok?`<div class="domain-item ok"><span>crt.sh</span><span>${extra.crt.years} a&ntilde;os</span></div>`:'');
 document.getElementById('todoList').innerHTML= ageRisk? '<li>No pagues, dominio creado hace pocos dias</li><li>Verifica IG oficial</li>' : '<li>Verifica redes</li><li>Pedi factura</li>';
 document.getElementById('disclaimerBox').innerHTML='<b>Transparencia:</b> Datos via '+(extra.source==='supabase'?'proxy propio Supabase (estable)':'proxy publico de respaldo (temporal) - deploya tu funcion para version estable')+'. No inventamos fechas.';
 renderExpSummaryForDomain(info?info.domain:raw);
 saveHist(info?info.domain:raw||'sin-dominio',nivel,'');
 renderHist();
 res.scrollIntoView({behavior:'smooth'});
};
function saveHist(d,r,i){try{var h=JSON.parse(localStorage.getItem('ss_hist')||'[]');h.unshift({d:d,r:r,fecha:new Date().toISOString()});localStorage.setItem('ss_hist',JSON.stringify(h.slice(0,12)));}catch(e){}}
function renderHist(){var c=document.getElementById('histList');try{var h=JSON.parse(localStorage.getItem('ss_hist')||'[]');if(!h.length){c.innerHTML='Sin analisis previos';return}c.innerHTML=h.map(x=>`<div class="hist-item"><span><b>${x.d}</b><br><span class="small">${new Date(x.fecha).toLocaleString('es-AR')}</span></span><span>${x.r}</span></div>`).join('');}catch(e){c.innerHTML='Sin analisis';}}
document.getElementById('btnClearHist').onclick=function(){localStorage.removeItem('ss_hist');renderHist();};renderHist();
var supabaseClient=null,misReportes=JSON.parse(localStorage.getItem('misReportes')||'[]'),todasExps=[];
function loadSupabase(){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=function(){supabaseClient=supabase.createClient('https://ltaghuumilyjdzpmatqj.supabase.co','sb_publishable_KXmx7LEqpZ3g5u-iRMeyDA__bWJBbqH');cargarExps();};document.head.appendChild(s);}loadSupabase();
async function cargarExps(){var cont=document.getElementById('listaExp'),resumen=document.getElementById('resumenExp');if(!supabaseClient){cont.innerHTML='Conectando...';return}var r=await supabaseClient.from('experiencias').select('*').order('id',{ascending:false}).limit(80);if(r.error){cont.innerHTML='Error: '+r.error.message;return}todasExps=r.data||[];if(!todasExps.length){cont.innerHTML='<p class=small>Sin experiencias.</p>';resumen.innerHTML='<b>Resumen</b><br><span class=small>Sin datos</span>';return}var ok=todasExps.filter(x=>x.tipo==='ok').length,dud=todasExps.filter(x=>x.tipo==='dudosa').length,mal=todasExps.filter(x=>x.tipo==='mala').length;resumen.innerHTML=`<b>Resumen</b><div class="state-row"><span class="state">Bien: ${ok}</span><span class="state">Dudosa: ${dud}</span><span class="state">Problemas: ${mal}</span></div>`;var html='';for(var i=0;i<todasExps.length;i++){var d=todasExps[i];var img='';if(d.foto) img=`<img src="${d.foto}" style="width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-top:8px">`;var tipoTxt=d.tipo==='ok'?'[BIEN]':d.tipo==='mala'?'[PROBLEMA]':'[DUDOSA]';var esMio=misReportes.indexOf(d.id)!==-1;var btnDel=esMio?`<button class=del onclick="borrarExp(${d.id})">Borrar</button>`:'<span class=small> - Solo autor</span>';html+=`<div class=exp-card><b>${tipoTxt} ${d.tienda}</b><br><div style="margin-top:6px;font-size:13px">${d.texto}</div>${img}<br>${btnDel}</div>`;}cont.innerHTML=html;}
function renderExpSummaryForDomain(raw){var c=document.getElementById('resExpSum');if(!c) return;if(!raw||!todasExps.length){c.innerHTML='Sin experiencias para este dominio.';return}var norm=raw.toLowerCase().replace(/https?:\/\//,'').replace(/^www\./,'').split('/')[0].replace(/^@/,'');var f=todasExps.filter(x=>{var t=(x.tienda||'').toLowerCase();return t.includes(norm)||norm.includes(t.replace(/@/g,''));});if(!f.length){c.innerHTML=`Sin experiencias para <b>${raw}</b>.`;return}var ok=f.filter(x=>x.tipo==='ok').length,dud=f.filter(x=>x.tipo==='dudosa').length,mal=f.filter(x=>x.tipo==='mala').length;c.innerHTML=`<div class="state-row"><span class="state">Bien: ${ok}</span><span class="state">Dudosa: ${dud}</span><span class="state">Problemas: ${mal}</span></div><p style="margin-top:6px">${f.length} reportes.</p>`;}
async function borrarExp(id){if(!confirm('Borrar?')) return;var r=await supabaseClient.from('experiencias').delete().eq('id',id);if(r.error){alert(r.error.message);return}misReportes=misReportes.filter(x=>x!==id);localStorage.setItem('misReportes',JSON.stringify(misReportes));cargarExps();}window.borrarExp=borrarExp;
document.getElementById('btnPub').onclick=async function(){if(!supabaseClient){alert('Espera');return}var tienda=document.getElementById('expTienda').value.trim(),texto=document.getElementById('expTexto').value.trim(),nombre=document.getElementById('expNombre').value.trim()||'Anonimo',tipo=document.getElementById('expTipo').value;if(!tienda||!texto){alert('Completa tienda y texto');return}var btn=this;btn.innerHTML='Publicando...';btn.disabled=true;var file=document.getElementById('expFoto').files[0],foto=null;if(file){foto=await new Promise(res=>{var r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(file);});}var result=await supabaseClient.from('experiencias').insert([{nombre:nombre,tienda:tienda,texto:texto,foto:foto,tipo:tipo}]).select();if(result.error) result=await supabaseClient.from('experiencias').insert([{nombre:nombre,tienda:tienda,texto:texto}]).select();if(result.error) alert(result.error.message);else{var nid=result.data&&result.data[0]&&result.data[0].id;if(nid){misReportes.push(nid);localStorage.setItem('misReportes',JSON.stringify(misReportes));}document.getElementById('expTienda').value='';document.getElementById('expTexto').value='';document.getElementById('expFoto').value='';cargarExps();}btn.innerHTML='Publicar';btn.disabled=false;};
</script>
</body>
</html>
